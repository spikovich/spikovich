name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate trophy.svg
        run: |
          mkdir -p dist
          if ! curl --fail --silent --show-error --location \
            "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=dracula&row=1&margin-w=8&margin-h=8" \
            --output dist/trophy.svg; then
            cat > dist/trophy.svg <<'SVG'
            <svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" role="img" aria-label="Profile trophy unavailable">
              <rect width="495" height="195" fill="#282A36"/>
              <text x="50%" y="45%" fill="#f8f8f2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20">
                Trophy generation unavailable
              </text>
              <text x="50%" y="62%" fill="#bd93f9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">
                Please re-run the workflow later
              </text>
            </svg>
            SVG
          fi

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
